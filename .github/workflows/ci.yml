name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md

      - name: Verify profile README content
        run: |
          test -f README.md
          grep -q "Iurii Izman" README.md
          grep -q "Selected projects" README.md
